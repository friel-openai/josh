[package]
name = "josh-core"
version = "22.4.15"
repository = "https://ithub.com/josh-project/josh"
authors = ["Christian Schilling <initcrash@gmail.com>"]
license-file = "LICENSE"
description = "GIT virtualization proxy"
keywords = ["git", "monorepo", "workflow", "scm"]
readme = "../README.md"
edition = "2024"

[[bench]]
name = "ultrawide"
harness = false

[dependencies]
backtrace = "0.3.76"
bitvec = "1.0.1"
git-version = "0.3.9"
git2 = { workspace = true }
gix-object = { workspace = true }
gix-config = { workspace = true }
gix-submodule = { workspace = true }
gix-hash = { workspace = true }
glob = "0.3.1"
hex = { workspace = true }
indoc = "2.0.7"
itertools = "0.14.0"
log = { workspace = true }
percent-encoding = "2.3.1"
pest = "2.8.4"
pest_derive = "2.8.4"
rayon = "1.11.0"
regex = { workspace = true }
rs_tracing = { workspace = true }
strfmt = "0.2.4"
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
sled = "0.34.7"
tracing = { workspace = true }
toml = { workspace = true }
rustc-hash = "2.1.1"
smallvec = "1.15.1"

[features]
default = ["fast_quote_if", "pathset_builders", "tree_perf_opt"]
incubating = []
bench = []
fast_quote_if = []
trace_filter_specs = []
pathset_builders = []
tree_perf_opt = []

[dev-dependencies]
criterion = "0.7.0"
rand = "0.9.2"
sha2 = "0.10.9"
tempfile = { workspace = true }

[[bench]]
name = "filter_perf"
harness = false
required-features = ["bench"]

[[bench]]
name = "wide_filters"
harness = false
required-features = ["bench"]

[[bench]]
name = "pin_wide"
harness = false
required-features = ["bench"]

[[bench]]
name = "hook_wide_filters"
harness = false
required-features = ["bench"]

[[bench]]
name = "tree_ops_perf"
harness = false
required-features = ["bench"]
